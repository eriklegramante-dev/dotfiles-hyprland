general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    immediate_render = true
}

background {
    monitor =
    path = /home/arch/Images/Wallpaper/rain.jpg
    blur_passes = 3
    blur_size = 6
    noise = 0.025
    contrast = 0.90
    brightness = 0.70
    vibrancy = 0.20
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(205, 225, 245, 0.85)
    font_size = 130
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(137, 180, 215, 0.85)
    font_size = 130
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %d %B"
    color = rgba(180, 200, 220, 0.75)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Italic
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50                  
    outline_thickness = 2           
    dots_size = 0.33               
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(137, 180, 215, 0.6)
    inner_color = rgba(15, 23, 30, 0.85)
    font_color = rgb(205, 225, 245)
    check_color = rgba(137, 180, 215, 0.9)
    fail_color = rgba(243, 139, 168, 0.8)

    fade_on_empty = false           
    placeholder_text = <span foreground="##a6adc8">󰖗  Type Password</span>
    hide_input = false
    rounding = 20
    position = 0, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] curl -s 'wttr.in?format=󰖗+%C\n+%t\n+%w\n+%h' 2>/dev/null || echo "Rainy night"
    color = rgba(137, 180, 215, 0.75)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 30, 25
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] uptime -p | sed 's/up /up /'
    color = rgba(180, 200, 220, 0.75)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -30, 25
    halign = right
    valign = bottom
}
